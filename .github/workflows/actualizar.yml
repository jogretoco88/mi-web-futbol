name: Actualizar datos de futbol

on:
  schedule:
    - cron: '*/30 * * * *' # Cada 30 min
  workflow_dispatch: # Permite ejecutar manual

permissions:
  contents: write # IMPORTANTE: Permiso de escritura

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.9'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests

      - name: Fetch data
        env:
          API_FOOTBALL_KEY: ${{ secrets.API_FOOTBALL_KEY }}
        run: python fetch_data.py

      - name: Commit and push changes
        run: |
          git config --global user.name 'github-actions'
          git config --global user.email 'github-actions@github.com'
          git add data.json
          git commit -m "Actualización automática de resultados" || echo "No hay cambios para commitear"
          git pull --rebase origin main
          git push origin main
